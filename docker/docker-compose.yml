# Phoenix en local. Rien ne sort du poste : les traces, les annotations et les
# datasets restent dans le volume ci-dessous.
#
#   docker compose -f docker/docker-compose.yml up -d
#   http://localhost:6006
services:
  phoenix:
    # Version épinglée : le code dépend d'un contrat REST précis de Phoenix
    # (annotations de span, datasets, experiments). Une image flottante peut
    # faire bouger ce contrat sous nos pieds sans qu'aucun test ne le dise.
    # Avant de relever la version, vérifier qu'elle existe sur
    # https://hub.docker.com/r/arizephoenix/phoenix/tags.
    image: arizephoenix/phoenix:20.16.0
    container_name: coachingia-phoenix
    ports:
      - "6006:6006"   # interface web + collecteur OTLP/HTTP
      - "4317:4317"   # collecteur OTLP/gRPC (ce que le harnais utilise)
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

volumes:
  phoenix-data:
