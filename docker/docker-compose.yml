# Phoenix en local. Rien ne sort du poste : les traces, les annotations et les
# datasets restent dans le volume ci-dessous.
#
#   docker compose -f docker/docker-compose.yml up -d
#   http://localhost:6006
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: coachingia-phoenix
    ports:
      - "6006:6006"   # interface web + collecteur OTLP/HTTP
      - "4317:4317"   # collecteur OTLP/gRPC (ce que le harnais utilise)
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

volumes:
  phoenix-data:
